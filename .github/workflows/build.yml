name: Build BengoPad.exe

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Smoke test imports
        run: python -c "import sys; sys.path.insert(0,'app'); import mapper, config, hooks, rp; print('ok')"
      - name: Build
        run: >
          pyinstaller --noconfirm --onefile --windowed --name BengoPad
          --paths app --collect-submodules pyremoteplay --collect-submodules pystray app/main.py
      - uses: actions/upload-artifact@v4
        with:
          name: BengoPad
          path: dist/BengoPad.exe
      - name: Publish release (used by the in-app updater)
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(python -c "import re;print(re.search(r'VERSION = \"([^\"]+)\"', open('app/main.py',encoding='utf-8').read()).group(1))")
          echo "Version $VER"
          if gh release view "v$VER" >/dev/null 2>&1; then
            gh release upload "v$VER" dist/BengoPad.exe --clobber
          else
            gh release create "v$VER" dist/BengoPad.exe --title "Bengo Pad $VER" --notes "Bengo Pad $VER" --latest
          fi
