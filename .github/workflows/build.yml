name: Build BengoPad.exe

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Smoke test imports
        run: python -c "import sys; sys.path.insert(0,'app'); import mapper, config, hooks, rp; print('ok')"
      - name: Build
        run: >
          pyinstaller --noconfirm --onefile --windowed --name BengoPad
          --paths app --collect-submodules pyremoteplay app/main.py
      - uses: actions/upload-artifact@v4
        with:
          name: BengoPad
          path: dist/BengoPad.exe
